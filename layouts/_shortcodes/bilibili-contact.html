{{/* Reuse the social menu URL and identity so both entry points stay in sync. */}}
{{ range where .Page.Site.Menus.social "Identifier" "bilibili" }}
    <a class="bilibili-contact" href="{{ .URL }}" target="_blank" rel="noopener noreferrer" aria-label="在 B站找到我：{{ .Params.nickname }}">
        {{ partial "helper/icon" .Params.icon }}
        <span class="bilibili-contact-details">
            <strong>{{ .Name }}：{{ .Params.nickname }}</strong>
            <span>{{ .Params.description }}</span>
            <span class="bilibili-contact-url">{{ .URL }}</span>
        </span>
    </a>
{{ end }}
